[package]
name = "rustly-judge-worker"
description = "The Rustly judge worker: resolves artifacts, compiles, sandboxes, grades, reports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rustly-judge-worker"
path = "src/main.rs"

[features]
default = []
# Enable the Cargo-based compiler. EXPERIMENTAL: compiling untrusted Rust runs
# untrusted code (build.rs, proc macros) and that sandbox is not yet qualified.
# Enabling the feature is not enough; it must also be unlocked at runtime.
cargo-compiler = []

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
reqwest.workspace = true
rustly-checker.workspace = true
rustly-grader.workspace = true
rustly-judge-cache.workspace = true
rustly-judge-common.workspace = true
rustly-judge-protocol.workspace = true
rustly-problem-format.workspace = true
rustly-sandbox.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
wat.workspace = true
