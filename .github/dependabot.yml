version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: ["type:chore", "area:deps"]
    # Wasmtime is the sandbox. Its updates are reviewed individually, never
    # grouped with unrelated bumps.
    groups:
      patch:
        update-types: ["patch"]
        exclude-patterns: ["wasmtime*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels: ["type:chore", "area:ci"]
